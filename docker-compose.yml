services:
  vintage-story:
    container_name: vsserver
    build:
      context: ./
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    environment:
      - SERVER_PORT=42420

    ports:
      - "42420:42420"
    volumes:
      - ./data:/data/server-file
      - ./mods:/data/server-file/Mods
